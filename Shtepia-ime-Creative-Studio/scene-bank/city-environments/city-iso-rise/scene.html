<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: radial-gradient(ellipse at 50% 55%, var(--ground2), var(--ground) 70%); }
    #root .world { perspective: 2600px; perspective-origin: 50% 35%; }
    #root .cam { position: absolute; inset: 0; transform-style: preserve-3d; }

    #root .tagpin { position: absolute; left: 50%; top: 50%; z-index: 6; }
  </style>
  <div id="root" data-composition-id="city-iso-rise" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="world"><div class="cam"></div></div>
      <div class="cap"><div class="kicker k"></div><div class="headline t"></div></div>
      <div class="d3-label tagpin"></div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('city-iso-rise', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    S.ready(() => {
      const D = S.d3;
      const plane = D.plane($('.cam'), { size: 2400, tiltX: 58, rotZ: -38 });
      const blocks = D.city(plane, { n: 8, cell: 180, seed: v.seed, maxH: 380, size: 2400 });
      $('.k').textContent = v.kicker;
      S.rich($('.t'), v.title);
      $('.tagpin').textContent = v.pin;
      gsap.set($('.cam'), { y: S.fmt.portrait ? 200 : 60, scale: S.fmt.portrait ? 0.95 : 0.75 });
      D.rise(tl, blocks, 0.1, { stagger: 0.012, dur: 0.9 });
      tl.fromTo(plane, { rotationZ: -60, rotationX: 62 }, { rotationZ: -30, rotationX: 56, duration: c.dur, ease: 'power1.inOut' }, 0);
      S.a.blurIn(tl, $('.k'), 0.3);
      S.a.wordsBlur(tl, S.words($('.t')), 0.45);
      tl.fromTo($('.tagpin'), { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'back.out(2)' }, 1.3);
      S.tx.out(c, $('.stage'), 'zoom-in');
      c.done();
    });
  })();
  </script>
