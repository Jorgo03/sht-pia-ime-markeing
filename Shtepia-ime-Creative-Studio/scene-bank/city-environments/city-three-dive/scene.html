<template>
  <script src="assets/kit/three.min.js"></script>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0806; }
    #root .cap { position: absolute; left: var(--safe-left); right: calc(var(--W) - var(--safe-right)); top: calc(var(--safe-top) + 10px); text-align: center; z-index: 5; }
    #root .cap .headline { font-size: 88px; }
    #root .scrim { position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, rgba(11,8,6,.75), rgba(11,8,6,0) 30%, rgba(11,8,6,0) 75%, rgba(11,8,6,.6)); }
  </style>
  <div id="root" data-composition-id="city-three-dive" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <canvas class="three-canvas"></canvas>
    <div class="scrim"></div>
    <div class="cap"><div class="kicker k"></div><div class="headline t"></div></div>
  </div>
  <script>
  (function () {
    const c = S.scene('city-three-dive', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    const D = S.d3;
    const stage = D.three($('.three-canvas'), { bg: '#0b0806', fog: { color: 0x0b0806, near: 30, far: 90 }, fov: S.fmt.portrait ? 50 : 34 });
    const city = D.threeCity(stage, { n: 17, seed: v.seed, maxH: 10 });
    const pin = D.threePin(stage, { scale: 1.3 }); stage.add(pin);
    const T = stage.T;
    $('.k').textContent = v.kicker;
    S.rich($('.t'), v.title);
    // Camera path: high orbit -> dive towards the centre where the pin lands.
    const from = new T.Vector3(34, 34, 40), to = new T.Vector3(13, 16, 19);
    D.drive(c, (t) => {
      const k = S.clamp(t / c.dur);
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      city.setGrowth(S.clamp(t / 1.6));
      const ang = 0.6 - 0.5 * e;
      const r = S.lerp(Math.hypot(from.x, from.z), Math.hypot(to.x, to.z), e);
      stage.camera.position.set(Math.sin(ang) * r, S.lerp(from.y, to.y, e), Math.cos(ang) * r);
      stage.camera.lookAt(0, 2.5 * e, 0);
      const pt = S.clamp((t - 1.3) / 0.7);
      pin.position.y = 11 + 14 * (1 - S.spring(pt, { damping: 0.55, freq: 1.4 }));
      pin.visible = t > 1.25;
      stage.render();
    });
    S.a.blurIn(tl, $('.k'), 0.2);
    S.a.wordsBlur(tl, S.words($('.t')), 0.35);
    S.tx.out(c, $('.cap'), 'blur');
    c.done();
  })();
  </script>
</template>
