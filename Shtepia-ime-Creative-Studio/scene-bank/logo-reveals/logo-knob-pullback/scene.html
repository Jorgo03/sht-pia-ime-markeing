<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: var(--ground); }
    #root .orb { position: absolute; left: 50%; top: 44%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle, #ffd2a8, var(--door) 60%, transparent 72%); }
    #root .halo { position: absolute; left: 50%; top: 44%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 60%); }
    /* The knob hole of the official symbol sits at 55.1% x 63.7% of its box. */
    #root .mark { position: absolute; left: 50%; top: 44%; width: 300px; height: 300px; margin-left: -165.3px; margin-top: -191.1px; transform-origin: 55.1% 63.7%; }
    #root .mark img { width: 100%; height: 100%; display: block; }
    #root .name { position: absolute; left: 50%; top: 52%; width: 620px; margin-left: -310px; opacity: 0; }
    #root .name img { width: 100%; display: block; }
    #root .handle { position: absolute; left: 0; right: 0; top: 62%; text-align: center; }
  </style>
  <div id="root" data-composition-id="logo-knob-pullback" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="halo"></div>
      <div class="orb"></div>
      <div class="mark"><img src="assets/logos/symbol-orange.svg" alt="Shtëpia.ime" /></div>
      <div class="name"><img class="lk" src="assets/logos/lockup-horizontal-dark.svg" alt="" /></div>
      <div class="kicker handle"></div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('logo-knob-pullback', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    S.ready(() => {
      $('.handle').textContent = v.handle;
      const H = S.fmt.H, W = S.fmt.W;
      tl.fromTo($('.orb'), { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.05);
      tl.fromTo($('.halo'), { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 0.8, duration: 1.4, ease: 'power2.out' }, 0.1);
      // Pull back from the knob: the symbol starts huge around its knob hole.
      tl.fromTo($('.mark'), { scale: 14, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.5, ease: 'expo.inOut' }, 0.45);
      tl.to($('.orb'), { opacity: 0, duration: 0.3 }, 1.4);
      // Then the symbol glides onto the door of the official horizontal lockup
      // and hands over to it: the logo is never rearranged, only revealed.
      const lockW = 620, lockH = lockW * 256 / 1027.61;           // lockup viewBox 1027.61 x 256
      const doorBox = lockH;                                      // the door occupies a lockH square at its left
      const lockLeft = W / 2 - lockW / 2, lockTop = H * 0.52;
      const s = doorBox / 300;                                    // .mark is 300 px for a 256 viewBox
      const markLeft = W / 2 - 165.3, markTop = H * 0.44 - 191.1;
      const ox = markLeft + 165.3, oy = markTop + 191.1;          // transform origin (knob)
      const cx = ox + (markLeft + 150 - ox) * s, cy = oy + (markTop + 150 - oy) * s;
      const tx = lockLeft + doorBox / 2 - cx, ty = lockTop + doorBox / 2 - cy;
      tl.to($('.mark'), { scale: s, x: tx, y: ty, duration: 0.75, ease: 'power3.inOut' }, 2.0);
      tl.to($('.halo'), { opacity: 0.35, duration: 0.75 }, 2.0);
      tl.set($('.name'), { opacity: 1 }, 2.75);
      tl.set($('.mark'), { opacity: 0 }, 2.75);
      tl.fromTo($('.name'), { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.01 }, 2.74);
      // The name sweeps in from behind the door (mask grows left to right).
      tl.fromTo($('.lk'), { clipPath: 'inset(0 75% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.6, ease: 'expo.out' }, 2.75);
      S.a.blurIn(tl, $('.handle'), 3.1);
      S.tx.out(c, $('.stage'), 'none');
      c.done();
    });
  })();
  </script>
</template>
