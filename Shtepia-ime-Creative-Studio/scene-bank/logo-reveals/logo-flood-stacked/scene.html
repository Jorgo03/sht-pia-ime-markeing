<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--ground); }
    #root .flood { position: absolute; inset: -10%; background: var(--accent); }
    #root .ink { position: absolute; inset: -10%; background: #000; }
    #root .stack { position: absolute; left: 50%; top: 46%; width: 520px; margin: -260px 0 0 -260px; }
    #root .stack img { width: 100%; display: block; }
    #root .line { position: absolute; left: var(--cap-x); right: var(--cap-x); top: 66%; text-align: center; }
    #root .line .headline { font-size: 64px; color: #fff; }
  </style>
  <div id="root" data-composition-id="logo-flood-stacked" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="flood"></div>
    <div class="ink"></div>
    <div class="stack"><img src="assets/logos/lockup-stacked-dark.svg" alt="Shtëpia.ime" /></div>
    <div class="line"><div class="headline t"></div></div>
  </div>
  <script>
  (function () {
    const c = S.scene('logo-flood-stacked', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    S.ready(() => {
      S.rich($('.t'), v.line);
      // Orange floods up from the bottom, then black wipes over it from the
      // top (the door never sits on orange: the logo appears on black only).
      tl.fromTo($('.flood'), { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: 'power3.inOut' }, 0);
      tl.fromTo($('.ink'), { yPercent: -100 }, { yPercent: 0, duration: 0.5, ease: 'power3.inOut' }, 0.45);
      tl.fromTo($('.stack'), { scale: 0.92, opacity: 0, filter: 'blur(14px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.7, ease: 'expo.out' }, 0.95);
      // Hidden until the logo has landed, then faint → ink word by word.
      tl.set($('.line'), { opacity: 0 }, 0);
      tl.set($('.line'), { opacity: 1 }, 1.45);
      S.a.wordsInk(tl, S.words($('.t')), 1.5, { stagger: 0.09 });
      S.tx.out(c, $('.stack'), 'none');
      c.done();
    });
  })();
  </script>
</template>
