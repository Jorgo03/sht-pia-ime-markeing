<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: var(--ground); }
    #root .odo { position: absolute; left: 0; right: 0; top: 46%; transform: translateY(-50%); display: flex; justify-content: center; align-items: flex-end; font-family: var(--font-serif); font-style: italic; color: var(--accent); letter-spacing: -0.02em; }
    #root .col { display: inline-block; height: 1.1em; overflow: hidden; line-height: 1.1em; position: relative; }
    #root .strip { display: block; }
    #root .strip span { display: block; height: 1.1em; text-align: center; }
    #root .sym { display: inline-block; line-height: 1.1em; height: 1.1em; }
    #root .sub { position: absolute; left: var(--cap-x); right: var(--cap-x); top: 56%; text-align: center; }
    #root .sub .headline { font-size: 64px; }
    #root .photo-chip { position: absolute; left: 50%; top: 22%; width: 420px; height: 300px; margin-left: -210px; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.5); }
    #root .photo-chip img { width: 100%; height: 100%; object-fit: cover; }
  </style>
  <div id="root" data-composition-id="stat-price-counter" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="photo-chip"><img alt="" /></div>
      <div class="odo"></div>
      <div class="sub"><div class="kicker k"></div><div class="headline t"></div></div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('stat-price-counter', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    const L = S.listing(v.listing) || S.listing('apartment-blloku');
    S.ready(() => {
      const text = S.price(L.price, { suffix: L.suffix || '' });
      const odo = $('.odo');
      const fs = S.fmt.portrait ? Math.min(220, 1700 / text.length) : 200;
      odo.style.fontSize = fs + 'px';
      // Odometer: each digit is a strip 0–9 that rolls to its value; columns
      // to the right roll more turns, so the number settles left to right.
      const digits = [];
      [...text].forEach((ch, i) => {
        if (/\d/.test(ch)) {
          const col = document.createElement('span'); col.className = 'col';
          const strip = document.createElement('span'); strip.className = 'strip';
          const turns = 1 + Math.floor(digits.length / 2);
          for (let k = 0; k <= 10 * turns + +ch; k++) { const s = document.createElement('span'); s.textContent = k % 10; strip.appendChild(s); }
          col.appendChild(strip); odo.appendChild(col); digits.push({ strip, steps: 10 * turns + +ch });
        } else { const s = document.createElement('span'); s.className = 'sym'; s.textContent = ch === ' ' ? ' ' : ch; odo.appendChild(s); }
      });
      $('.photo-chip img').src = S.asset(L.photo);
      $('.k').textContent = [L.deal, L.city].filter(Boolean).join(' · ');
      S.rich($('.t'), v.title || L.title || '');
      digits.forEach((d, i) => {
        tl.fromTo(d.strip, { y: 0 }, { y: -d.steps * 1.1 * fs, duration: 1.2 + i * 0.12, ease: 'power3.out' }, 0.35);
      });
      tl.fromTo($('.photo-chip'), { y: 60, opacity: 0, rotation: -4 }, { y: 0, opacity: 1, rotation: -2, duration: 0.7, ease: 'expo.out' }, 0);
      S.a.blurIn(tl, $('.k'), 1.2);
      S.a.wordsBlur(tl, S.words($('.t')), 1.35);
      S.tx.out(c, $('.stage'), 'blur');
      c.done();
    }, [L.photo]);
  })();
  </script>
</template>
