<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #root .slats { position: absolute; inset: 0; }
    #root .slat { position: absolute; top: 0; bottom: 0; overflow: hidden; }
    #root .slat img { position: absolute; top: 0; height: 100%; object-fit: cover; }
    #root .info { position: absolute; left: var(--cap-x); right: var(--cap-x); bottom: calc(var(--H) - var(--safe-bottom) + 10px); z-index: 6; color: #fff; }
    #root .price { font-family: var(--font-serif); font-style: italic; font-size: 120px; color: var(--accent); letter-spacing: -0.02em; line-height: 1; }
    #root .where { color: rgba(255,255,255,.85); margin-bottom: 18px; }
    #root .title { font-size: 58px; color: #fff; margin-top: 18px; }
  </style>
  <div id="root" data-composition-id="property-shutter-reveal" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="slats"></div>
    <div class="scrim-host layer"></div>
    <div class="info"><div class="kicker where"></div><div class="price"></div><div class="headline title"></div></div>
  </div>
  <script>
  (function () {
    const c = S.scene('property-shutter-reveal', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    const L = S.listing(v.listing) || {};
    const photo = v.photo || L.photo;
    S.ready(() => {
      const W = S.fmt.W, n = v.slats;
      const slats = [];
      for (let i = 0; i < n; i++) {
        const s = document.createElement('div'); s.className = 'slat';
        Object.assign(s.style, { left: (W / n) * i + 'px', width: Math.ceil(W / n) + 1 + 'px' });
        const img = document.createElement('img'); img.src = S.asset(photo);
        Object.assign(img.style, { left: -(W / n) * i + 'px', width: W + 'px' });
        s.appendChild(img); $('.slats').appendChild(s); slats.push(s);
      }
      S.cine.scrim($('.scrim-host'), { side: 'bottom', strength: 0.8, size: 50 });
      $('.where').textContent = `${L.deal ? L.deal + ' · ' : ''}${L.city || ''}`;
      S.rich($('.title'), v.title || L.title || '');
      // Slats open from the centre outwards, each a vertical clip.
      slats.forEach((s, i) => {
        const d = Math.abs(i - (n - 1) / 2);
        tl.fromTo(s, { clipPath: 'inset(50% 0 50% 0)' }, { clipPath: 'inset(0% 0 0% 0)', duration: 0.7, ease: 'expo.out' }, 0.05 + d * 0.06);
      });
      tl.fromTo($('.slats'), { scale: 1.12 }, { scale: 1, duration: c.dur, ease: 'power2.out' }, 0);
      S.a.blurIn(tl, $('.where'), 0.6);
      S.a.price(tl, $('.price'), L.price || 0, 0.7, { dur: 1.2, suffix: L.suffix || '' });
      S.a.wordsBlur(tl, S.words($('.title')), 1.3);
      S.tx.out(c, $('.slats'), 'blur');
      S.tx.out(c, $('.info'), 'blur');
      c.done();
    }, [photo]);
  })();
  </script>
</template>
