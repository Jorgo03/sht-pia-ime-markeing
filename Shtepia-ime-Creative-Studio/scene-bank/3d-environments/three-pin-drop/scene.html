<template>
  <script src="assets/kit/three.min.js"></script>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0806; }
    #root .lab { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 40px); text-align: center; z-index: 5; }
    #root .lab .headline { font-size: 120px; color: #fff; }
  </style>
  <div id="root" data-composition-id="three-pin-drop" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <canvas class="three-canvas"></canvas>
    <div class="lab"><div class="kicker k"></div><div class="headline t"></div></div>
  </div>
  <script>
  (function () {
    const c = S.scene('three-pin-drop', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    const D = S.d3;
    const st = D.three($('.three-canvas'), { bg: '#0b0806', fov: S.fmt.portrait ? 42 : 30, fog: { color: 0x0b0806, near: 18, far: 60 } });
    const T = st.T;
    const ground = new T.Mesh(new T.PlaneGeometry(200, 200), new T.MeshStandardMaterial({ color: 0x1b1613, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; st.add(ground);
    const grid = new T.GridHelper(80, 40, 0x3a2e26, 0x2a211b); grid.position.y = 0.01; st.add(grid);
    const pin = D.threePin(st, { scale: 1.2 }); st.add(pin);
    // A ripple ring where the pin lands (one ring, once).
    const ring = new T.Mesh(new T.RingGeometry(0.9, 1.05, 64), new T.MeshBasicMaterial({ color: 0xff7d1a, transparent: true }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; st.add(ring);
    $('.k').textContent = v.kicker; S.rich($('.t'), v.place);
    const land = 0.9;
    D.drive(c, (t) => {
      const k = S.clamp(t / c.dur);
      st.camera.position.set(Math.sin(0.5 - k * 0.6) * 24, 13 - k * 2, Math.cos(0.5 - k * 0.6) * 24);
      st.camera.lookAt(0, 4.5, 0);
      const pt = S.clamp((t - 0.15) / 0.75);
      pin.position.y = 14 * (1 - S.spring(pt, { damping: 0.5, freq: 1.3 }));
      pin.rotation.y = t * 1.2;
      const rt = S.clamp((t - land) / 1.2);
      ring.scale.setScalar(1 + rt * 7);
      ring.material.opacity = t < land ? 0 : 0.8 * (1 - rt);
      st.render();
    });
    S.a.blurIn(tl, $('.k'), 0.9);
    S.a.charsIn(tl, S.chars($('.t')), 1.0, { stagger: 0.05 });
    S.tx.out(c, $('.lab'), 'blur');
    c.done();
  })();
  </script>
</template>
