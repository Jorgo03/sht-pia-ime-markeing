<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: var(--ground); }
    #root .sea { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 60%, var(--ground2), var(--ground) 70%); }
    #root .mapbox { position: absolute; left: 50%; top: 56%; }
    #root .mapbox svg { width: 100%; height: 100%; display: block; overflow: visible; }
    #root .land.neighbour { fill: var(--surface); opacity: .55; }
    #root .land.home { fill: var(--paper); stroke: var(--accent); stroke-width: 3; }
    #root .pin { position: absolute; width: 56px; margin-left: -28px; margin-top: -74px; z-index: 3; transform-origin: 50% 100%; }
    #root .pin svg { width: 56px; height: 74px; display: block; }
    #root .city { position: absolute; z-index: 4; transform: translate(26px, -50%); white-space: nowrap; font-family: var(--font-sans); font-weight: 700; font-size: 30px; color: var(--ink);
      background: var(--surface); padding: 8px 16px; border-radius: 999px; box-shadow: 0 10px 24px rgba(0,0,0,.3); }
    #root .credit { position: absolute; right: var(--cap-x); bottom: calc(var(--H) - var(--safe-bottom)); font-size: 18px; opacity: .5; }
  </style>
  <div id="root" data-composition-id="map-albania-pins" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="sea"></div>
      <div class="mapbox"></div>
      <div class="cap"><div class="kicker k"></div><div class="headline t"></div></div>
      <div class="kicker credit" data-layout-ignore>Natural Earth</div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('map-albania-pins', window.__hyperframes.getVariables());
    const { tl, v, $, $$ } = c;
    S.ready(() => {
      const m = window.STUDIO_DATA.map;
      // Fit the map (and its southern labels) between the caption and the safe bottom.
      const sf = S.fmt.safe;
      const top0 = S.fmt.portrait ? sf.top + 300 : sf.top + 40, bot0 = sf.bottom - 50;
      const bh = Math.min(bot0 - top0, S.fmt.portrait ? 1180 : S.fmt.H * 0.86);
      const bw = bh * m.width / m.height;
      const box = $('.mapbox');
      Object.assign(box.style, { width: bw + 'px', height: bh + 'px', marginLeft: -bw / 2 + 'px', marginTop: '0px', top: top0 + 'px' });
      if (!S.fmt.portrait) box.style.left = '62%';
      box.innerHTML = S.print.albania({});
      $('.k').textContent = v.kicker;
      S.rich($('.t'), v.title);
      const keys = String(v.cities).split(/\s*,\s*/).filter((k) => m.cities[k]);
      const pins = [], labels = [];
      keys.forEach((k) => {
        const city = m.cities[k];
        const pin = document.createElement('div'); pin.className = 'pin'; pin.innerHTML = S.print.pin({ size: 56 });
        Object.assign(pin.style, { left: city.fx * 100 + '%', top: city.fy * 100 + '%' });
        const lab = document.createElement('div'); lab.className = 'city'; lab.textContent = city.name;
        Object.assign(lab.style, { left: city.fx * 100 + '%', top: (city.fy * 100 - 2.6) + '%' });
        box.append(pin, lab); pins.push(pin); labels.push(lab);
      });
      const home = box.querySelector('.home');
      // The coastline draws itself, the land fills, then the pins drop city by city.
      home.setAttribute('pathLength', '100');
      // Frame 0 already shows the land faintly and the headline (thumbnail);
      // the coastline then draws itself and the land fills.
      S.a.draw(tl, home, 0.0, { dur: 1.0 });
      tl.fromTo(home, { fillOpacity: 0.25 }, { fillOpacity: 1, duration: 0.6, ease: 'power2.out' }, 0.7);
      tl.fromTo($$('.neighbour'), { opacity: 0.3 }, { opacity: 0.55, duration: 0.6 }, 0.2);
      tl.set([$('.k'), $('.t')], { opacity: 1 }, 0);
      tl.fromTo(box, { scale: 1.08 }, { scale: 1, duration: c.dur, ease: 'power2.out' }, 0);
      pins.forEach((p, i) => {
        const t = 1.05 + i * 0.16;
        tl.fromTo(p, { y: -120, opacity: 0, scaleY: 1.2 }, { y: 0, opacity: 1, scaleY: 1, duration: 0.45, ease: 'bounce.out' }, t);
        tl.fromTo(labels[i], { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' }, t + 0.3);
      });
      S.tx.out(c, $('.stage'), 'blur');
      c.done();
    });
  })();
  </script>
</template>
