<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #root .band { position: absolute; left: -60%; top: -20%; width: 70%; height: 140%; transform: skewX(-14deg); }
    #root .b1 { background: var(--accent); }
    #root .b2 { background: var(--accent-deep); }
    #root .b3 { background: var(--ground); }
  </style>
  <div id="root" data-composition-id="tx-orange-wipe" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="band b3"></div><div class="band b2"></div><div class="band b1"></div>
  </div>
  <script>
  (function () {
    const c = S.scene('tx-orange-wipe', window.__hyperframes.getVariables());
    const { tl, $ } = c;
    // Three skewed bands sweep across; the frame is fully covered at the
    // middle of the slot, which is where the cut underneath should fall.
    const d = c.dur, W = S.fmt.W;
    [$('.b1'), $('.b2'), $('.b3')].forEach((b, i) => {
      tl.fromTo(b, { x: -W * 0.2 }, { x: W * 2.4, duration: d * 0.85, ease: 'power3.inOut' }, i * d * 0.06);
    });
    c.done();
  })();
  </script>
</template>
