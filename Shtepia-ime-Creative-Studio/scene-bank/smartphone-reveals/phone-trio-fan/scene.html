<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: var(--ground); perspective: 2600px; }
    #root .host { position: absolute; inset: 0; }
    #root .cap.low .headline { font-size: 80px; }
  </style>
  <div id="root" data-composition-id="phone-trio-fan" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="glow"></div>
      <div class="host h0"></div><div class="host h1"></div><div class="host h2"></div>
      <div class="cap"><div class="headline t"></div></div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('phone-trio-fan', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    S.ready(() => {
      const ids = String(v.screens).split(/\s*,\s*/).slice(0, 3);
      const land = S.fmt.landscape;
      const w = land ? 300 : 400;
      const y = land ? 70 : 160;
      const phones = [1, 0, 2].map((k) => S.ui.phone($('.h' + k), { screen: ids[k], theme: v.theme, w, y, glare: k === 0 }));
      // Order: centre on top.
      $('.h0').style.zIndex = 3; $('.h1').style.zIndex = 2; $('.h2').style.zIndex = 1;
      const spread = land ? 420 : 300;
      const [mid, left, right] = phones;
      S.rich($('.t'), v.title);
      tl.fromTo([mid.el, left.el, right.el], { y: 1200 }, { y: 0, duration: 0.9, ease: 'expo.out', stagger: 0.05 }, 0);
      tl.fromTo(left.el, { x: 0, rotation: 0, scale: 0.92 }, { x: -spread, rotation: -9, scale: 0.86, duration: 0.9, ease: 'expo.out' }, 0.7);
      tl.fromTo(right.el, { x: 0, rotation: 0, scale: 0.92 }, { x: spread, rotation: 9, scale: 0.86, duration: 0.9, ease: 'expo.out' }, 0.7);
      S.ui.glare(tl, mid, 1.2, 1.3);
      S.a.wordsRise(tl, S.words($('.t')), 0.5);
      S.tx.out(c, $('.stage'), 'zoom-in');
      c.done();
    });
  })();
  </script>
</template>
