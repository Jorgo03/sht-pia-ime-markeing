<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: var(--ground); }
    #root .side { position: absolute; left: var(--cap-x); right: var(--cap-x); bottom: calc(var(--H) - var(--safe-bottom) + 6px); text-align: center; z-index: 6; }
    #root .side .w { font-family: var(--font-sans); }
  </style>
  <div id="root" data-composition-id="search-filters-sheet" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="glow"></div>
      <div class="phone-host layer"></div>
      <div class="cap"><div class="headline t"></div></div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('search-filters-sheet', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    S.ready(() => {
      const land = S.fmt.landscape;
      const p = S.ui.phone($('.phone-host'), { screen: 'explore', theme: v.theme, w: land ? 380 : 540, y: land ? 40 : 150 });
      S.rich($('.t'), v.title);
      tl.set(p.el, { opacity: 1 }, 0);
      S.a.wordsBlur(tl, S.words($('.t')), 0.1);
      // Press the real filter button; the real filters sheet rises.
      S.ui.press(tl, p, 'filterButton', 0.45, { screen: 'explore' });
      S.ui.go(tl, p, 'filters', 0.7, { kind: 'rise', dur: 0.55 });
      // Visit the filters named in `stops`, with a callout for each.
      const stops = String(v.stops).split(/\s*,\s*/).filter(Boolean);
      const labels = String(v.labels).split(/\s*,\s*/);
      let t = 1.35;
      stops.forEach((r, i) => {
        S.ui.zoomTo(tl, p, r, t, { screen: 'filters', scale: v.zoom, dur: 0.6 });
        const call = S.ui.callout(p, r, labels[i] || r, { screen: 'filters', side: 'top', gap: 16 });
        call.style.fontSize = 34 / v.zoom + 'px'; call.style.padding = `${14 / v.zoom}px ${24 / v.zoom}px`;
        S.a.pop(tl, call, t + 0.45);
        tl.to(call, { opacity: 0, duration: 0.15 }, t + 1.0);
        t += 1.05;
      });
      S.ui.zoomOut(tl, p, t, { dur: 0.6 });
      S.ui.press(tl, p, 'showResults', t + 0.55, { screen: 'filters' });
      S.tx.out(c, $('.stage'), 'blur');
      c.done();
    });
  })();
  </script>
</template>
