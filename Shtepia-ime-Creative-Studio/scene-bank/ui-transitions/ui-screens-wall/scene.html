<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: var(--ground); perspective: 2600px; }
    #root .wall { position: absolute; left: 50%; top: 50%; width: 2400px; height: 3600px; margin: -1800px 0 0 -1200px; transform-style: preserve-3d; }

  <div id="root" data-composition-id="ui-screens-wall" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="wall" data-layout-ignore></div>
      <div class="veil"></div>
      <div class="mid"><div class="kicker k"></div><div class="headline t"></div></div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('ui-screens-wall', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    S.ready(() => {
      const ids = ['home', 'explore', 'map', 'detail-1', 'filters', 'detail-2', 'home-scrolled', 'detail-1-scrolled', 'detail-2-scrolled'];
      const r = S.rng(5);
      const cols = [];

          const img = document.createElement('img'); img.src = S.screen(id, th); col.appendChild(img);

        $('.wall').appendChild(col); cols.push(col);

      $('.k').textContent = v.kicker; S.rich($('.t'), v.title);
      gsap.set($('.wall'), { rotationX: 34, rotationZ: -22, scale: S.fmt.portrait ? 0.9 : 0.7 });

      tl.fromTo($('.wall'), { z: -400 }, { z: 0, duration: c.dur, ease: 'power1.out' }, 0);

      S.a.wordsRise(tl, S.words($('.t')), 0.45);
      S.tx.out(c, $('.stage'), 'blur');
      c.done();
    });

  </script>
