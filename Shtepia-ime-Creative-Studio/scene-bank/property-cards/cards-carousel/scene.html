<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: var(--ground); }
    #root .track { position: absolute; left: 0; top: 50%; height: 0; white-space: nowrap; }
    #root .pc { position: absolute; top: 0; width: 560px; height: 760px; margin-top: -330px; border-radius: 36px; overflow: hidden; background: var(--surface); box-shadow: 0 40px 80px rgba(0,0,0,.45); }
    #root .pc img { width: 100%; height: 72%; object-fit: cover; display: block; }
    #root .pc .meta { padding: 26px 34px; }
    #root .pc .p { font-family: var(--font-serif); font-style: italic; font-size: 62px; color: var(--accent-text, var(--accent)); line-height: 1; }
    #root .pc .c { margin-top: 10px; font-family: var(--font-sans); font-weight: 600; font-size: 30px; color: var(--ink-muted); }
    #root .tag { position: absolute; left: 26px; top: 26px; font-family: var(--font-mono); font-size: 22px; letter-spacing: .14em; color: #fff; background: rgba(0,0,0,.45); padding: 8px 14px; border-radius: 8px; }
  </style>
  <div id="root" data-composition-id="cards-carousel" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="track"></div>
      <div class="cap"><div class="kicker k"></div><div class="headline t"></div></div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('cards-carousel', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    const keys = String(v.listings).split(/\s*,\s*/).filter((k) => S.listing(k));
    S.ready(() => {
      const gap = 600, W = S.fmt.W;
      const cards = keys.map((k, i) => {
        const L = S.listing(k);
        const d = document.createElement('div'); d.className = 'pc';
        d.innerHTML = `<img src="${S.asset(L.photo)}" alt=""><div class="tag">${L.deal || (L.suffix ? 'Qira' : '')}</div><div class="meta"><div class="p"></div><div class="c"></div></div>`;
        if (!d.querySelector('.tag').textContent) d.querySelector('.tag').remove();
        d.querySelector('.p').textContent = S.price(L.price, { suffix: L.suffix || '' });
        d.querySelector('.c').textContent = '◉ ' + L.city;
        d.style.left = i * gap + 'px';
        $('.track').appendChild(d); return d;
      });
      $('.k').textContent = v.kicker; S.rich($('.t'), v.title);
      // The track glides so each card passes the centre; the centred card is
      // larger and sharp, its neighbours smaller and softer (computed per frame).
      const p = { x: 0 }; const n = cards.length;
      const draw = () => {
        cards.forEach((el, i) => {
          const cx = i * gap + 280 - p.x;               // card centre in track space
          const d = (cx - W / 2) / gap;                 // distance from centre in cards
          const a = Math.min(1, Math.abs(d));
          el.style.transform = `translateX(${-p.x}px) scale(${1 - 0.18 * a}) rotate(${d * 4}deg)`;
          el.style.opacity = String(1 - 0.45 * a);
          el.style.filter = `blur(${a * 3}px)`;
          el.style.zIndex = String(100 - Math.round(a * 10));
        });
      };
      const x0 = 280 - W / 2, x1 = (n - 1) * gap + 280 - W / 2;
      p.x = x0 - 500; draw();
      tl.fromTo(p, { x: x0 - 500 }, { x: x0, duration: 0.7, ease: 'expo.out', onUpdate: draw }, 0);
      tl.to(p, { x: x1, duration: Math.max(0.6, c.dur - 1.3), ease: 'power2.inOut', onUpdate: draw }, 0.8);
      S.a.blurIn(tl, $('.k'), 0.15);
      S.a.wordsBlur(tl, S.words($('.t')), 0.25);
      S.tx.out(c, $('.stage'), 'whip-left');
      c.done();
    }, keys.map((k) => S.listing(k).photo));
  })();
  </script>
</template>
