<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .stage { background: var(--ground); }
    #root .block { position: absolute; left: var(--cap-x); right: var(--cap-x); top: 50%; transform: translateY(-50%); text-align: center; }
    #root .lead { font-size: 100px; }
    #root .slot-win { display: block; height: 1.25em; overflow: hidden; margin-top: 10px; font-size: 150px; line-height: 1.2; }
    #root .slot { display: block; font-family: var(--font-serif); font-style: italic; color: var(--accent); }
    #root .rule { width: 260px; height: 3px; margin: 30px auto 0; background: var(--accent); }
    #root .sub { margin-top: 34px; }
  </style>
  <div id="root" data-composition-id="hook-city-slot" data-width="1080" data-height="1920" data-composition-variables='[]'>
    <div class="stage layer">
      <div class="block">
        <div class="headline lead"></div>
        <div class="headline slot-win"><span class="slot"></span></div>
        <div class="rule"></div>
        <div class="kicker sub"></div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('hook-city-slot', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    S.ready(() => {
      S.rich($('.lead'), v.lead);
      $('.sub').textContent = v.sub;
      const opts = String(v.options).split(/\s*,\s*/).filter(Boolean);
      tl.set($('.lead'), { opacity: 1 }, 0); // frame 0 already reads
      const end = S.a.slot(tl, $('.slot'), opts, 0.25, { each: Math.min(0.16, 1.3 / opts.length) });
      S.a.rule(tl, $('.rule'), end);
      S.a.blurIn(tl, $('.sub'), end + 0.15);
      S.tx.out(c, $('.stage'), 'whip-up');
      c.done();
    });
  })();
  </script>
</template>
