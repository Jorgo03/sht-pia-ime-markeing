<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #root .under { position: absolute; inset: 0; }
    #root .under img { width: 100%; height: 100%; object-fit: cover; }
    #root .strip { position: absolute; left: -2%; right: -2%; }
    #root .scrim-top { position: absolute; left: 0; right: 0; top: 0; height: 45%; background: linear-gradient(to bottom, rgba(0,0,0,.6), rgba(0,0,0,0)); opacity: 0; }
    #root .cap .headline { color: #1a1714; }
    #root .badge { position: absolute; left: var(--cap-x); bottom: calc(var(--H) - var(--safe-bottom) + 10px); z-index: 8; }
  </style>
  <div data-hf-id="hf-tol2" id="root" data-composition-id="s04-paper-torn-reveal" data-width="1080" data-height="1920" data-composition-variables='[{"id":"duration","type":"number","label":"Duration (s)","default":3,"min":0.5,"max":600,"step":0.1},{"id":"start","type":"number","label":"Start in film (s, set by the builder)","default":0,"min":0,"max":3600,"step":0.01},{"id":"in","type":"enum","label":"Transition in","default":"none","options":[{"value":"auto","label":"auto"},{"value":"none","label":"none"},{"value":"blur","label":"blur"},{"value":"whip-left","label":"whip-left"},{"value":"whip-right","label":"whip-right"},{"value":"whip-up","label":"whip-up"},{"value":"zoom-in","label":"zoom-in"},{"value":"zoom-out","label":"zoom-out"},{"value":"iris","label":"iris"},{"value":"slide-up","label":"slide-up"},{"value":"shutter","label":"shutter"},{"value":"paper","label":"paper"},{"value":"flood","label":"flood"},{"value":"dip","label":"dip"}]},{"id":"out","type":"enum","label":"Transition out","default":"blur","options":[{"value":"auto","label":"auto"},{"value":"none","label":"none"},{"value":"blur","label":"blur"},{"value":"whip-left","label":"whip-left"},{"value":"whip-right","label":"whip-right"},{"value":"whip-up","label":"whip-up"},{"value":"zoom-in","label":"zoom-in"},{"value":"zoom-out","label":"zoom-out"},{"value":"iris","label":"iris"},{"value":"slide-up","label":"slide-up"},{"value":"shutter","label":"shutter"},{"value":"paper","label":"paper"},{"value":"dip","label":"dip"}]},{"id":"palette","type":"enum","label":"Palette","default":"","options":[{"value":"","label":"(scene default)"},{"value":"night","label":"night"},{"value":"paper","label":"paper"},{"value":"orange","label":"orange"},{"value":"navy","label":"navy"},{"value":"mono","label":"mono"}]},{"id":"title","type":"string","label":"Headline (*accent*)","default":"Pas çdo dere, *një histori.*"},{"id":"photo","type":"string","label":"Photo path","default":"assets/property-images/stone-house.jpg"},{"id":"badge","type":"string","label":"Stamp label","default":"Gjirokastër"}]'>
    <div data-hf-id="hf-szgi" class="under"><img data-hf-id="hf-clbz" alt="" /></div>
    <div data-hf-id="hf-0bcg" class="scrim-top"></div>
    <div data-hf-id="hf-bfa6" class="strips" data-palette="paper"></div>
    <div data-hf-id="hf-9zt5" class="cap" data-palette="paper"><div data-hf-id="hf-g5r0" class="headline t"></div></div>
    <div data-hf-id="hf-jice" class="print-label badge" data-palette="paper"></div>
  </div>
  <script>
  (function () {
    const c = S.scene('s04-paper-torn-reveal', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    S.ready(() => {
      $('.under img').src = S.asset(v.photo);
      $('.badge').textContent = v.badge;
      S.rich($('.t'), v.title);
      // Paper covers the photo in strips with torn edges; they are torn away
      // one after another (top strip keeps the headline until last).
      const n = 5, H = S.fmt.H;
      const strips = [];
      for (let i = 0; i < n; i++) {
        const s = document.createElement('div'); s.className = 'strip paper';
        Object.assign(s.style, { top: (H / n) * i - 6 + 'px', height: H / n + 18 + 'px' });
        S.print.torn(s, { edge: 'bottom', seed: 10 + i, depth: 7, teeth: 22 });
        $('.strips').appendChild(s); strips.push(s);
      }
      const order = [4, 3, 2, 1];
      order.forEach((idx, k) => S.print.peel(tl, strips[idx], 0.5 + k * 0.17, { dur: 0.5, dir: k % 2 ? -1 : 1 }));
      tl.set($('.cap'), { opacity: 1 }, 0);
      S.print.peel(tl, strips[0], 1.35, { dur: 0.5 });
      tl.to($('.t'), { color: '#fff', textShadow: '0 6px 30px rgba(0,0,0,.5)', duration: 0.3 }, 1.4);
      tl.to($('.scrim-top'), { opacity: 1, duration: 0.4 }, 1.3);
      tl.fromTo($('.under img'), { scale: 1.12 }, { scale: 1, duration: c.dur, ease: 'power2.out' }, 0);
      S.print.stamp(tl, $('.badge'), 1.8, { rot: -4 });
      S.tx.out(c, $('.under'), 'blur');
      c.done();
    }, [v.photo]);
  })();
  </script>
</template>
