<template>
  <style>

    #root .code.on { color: #fff; background: var(--accent); box-shadow: none; }
  </style>
  <div data-hf-id="hf-dj2z" id="root" data-composition-id="s04-feature-languages" data-width="1080" data-height="1920" data-composition-variables='[{"id":"duration","type":"number","label":"Duration (s)","default":4.2,"min":0.5,"max":600,"step":0.1},{"id":"start","type":"number","label":"Start in film (s, set by the builder)","default":0,"min":0,"max":3600,"step":0.01},{"id":"in","type":"enum","label":"Transition in","default":"none","options":[{"value":"auto","label":"auto"},{"value":"none","label":"none"},{"value":"blur","label":"blur"},{"value":"whip-left","label":"whip-left"},{"value":"whip-right","label":"whip-right"},{"value":"whip-up","label":"whip-up"},{"value":"zoom-in","label":"zoom-in"},{"value":"zoom-out","label":"zoom-out"},{"value":"iris","label":"iris"},{"value":"slide-up","label":"slide-up"},{"value":"shutter","label":"shutter"},{"value":"paper","label":"paper"},{"value":"flood","label":"flood"},{"value":"dip","label":"dip"}]},{"id":"out","type":"enum","label":"Transition out","default":"blur","options":[{"value":"auto","label":"auto"},{"value":"none","label":"none"},{"value":"blur","label":"blur"},{"value":"whip-left","label":"whip-left"},{"value":"whip-right","label":"whip-right"},{"value":"whip-up","label":"whip-up"},{"value":"zoom-in","label":"zoom-in"},{"value":"zoom-out","label":"zoom-out"},{"value":"iris","label":"iris"},{"value":"slide-up","label":"slide-up"},{"value":"shutter","label":"shutter"},{"value":"paper","label":"paper"},{"value":"dip","label":"dip"}]},{"id":"palette","type":"enum","label":"Palette","default":"","options":[{"value":"","label":"(scene default)"},{"value":"night","label":"night"},{"value":"paper","label":"paper"},{"value":"orange","label":"orange"},{"value":"navy","label":"navy"},{"value":"mono","label":"mono"}]},{"id":"kicker","type":"string","label":"Kicker","default":"Edhe për diasporën"},{"id":"title","type":"string","label":"Headline (*accent*)","default":"Në *8 gjuhë.*"}]'>
    <div data-hf-id="hf-jx4t" class="stage layer">
      <div data-hf-id="hf-2mgg" class="cap"><div data-hf-id="hf-kqmg" class="kicker k"></div><div data-hf-id="hf-g5r0" class="headline t"></div></div>
      <div data-hf-id="hf-2ltc" class="hello"></div>
      <div data-hf-id="hf-pv9y" class="codes"></div>
    </div>
  </div>
  <script>
  (function () {
    const c = S.scene('s04-feature-languages', window.__hyperframes.getVariables());
    const { tl, v, $ } = c;
    // The app's 8 locales (src/i18n/locales) and a welcome in each.
    const langs = [['SQ', 'Mirë se vini'], ['EN', 'Welcome'], ['IT', 'Benvenuti'], ['DE', 'Willkommen'], ['FR', 'Bienvenue'], ['ES', 'Bienvenidos'], ['PL', 'Witamy'], ['RU', 'Добро пожаловать']];
    S.ready(() => {
      $('.k').textContent = v.kicker; S.rich($('.t'), v.title);
      const words = langs.map(([, w]) => { const d = document.createElement('div'); d.className = 'word'; d.textContent = w;
        // Newsreader has no Cyrillic: set Russian in Manrope (which does).
        if (/[\u0400-\u04FF]/.test(w)) Object.assign(d.style, { fontFamily: 'Manrope', fontStyle: 'normal', fontWeight: '700' }); $('.hello').appendChild(d); S.fit(d, { maxWidth: S.fmt.W - 2 * Math.max(S.fmt.safe.left, S.fmt.W - S.fmt.safe.right), max: 150, min: 60 }); return d; });
      const codes = langs.map(([k]) => { const d = document.createElement('div'); d.className = 'code'; d.textContent = k; $('.codes').appendChild(d); return d; });
      S.a.blurIn(tl, $('.k'), 0.05);
      S.a.wordsBlur(tl, S.words($('.t')), 0.15);
      S.a.pop(tl, codes, 0.3, { stagger: 0.04 });
      const each = Math.min(0.42, (c.dur - 1.0) / langs.length);
      words.forEach((w, i) => {
        const t = 0.5 + i * each;
        tl.fromTo(w, { opacity: 0, yPercent: 40, filter: 'blur(8px)' }, { opacity: 1, yPercent: 0, filter: 'blur(0px)', duration: 0.18, ease: 'power3.out' }, t);
        tl.set(codes[i], { backgroundColor: 'var(--accent)', color: '#fff', boxShadow: 'none' }, t);
        if (i < langs.length - 1) {
          tl.to(w, { opacity: 0, yPercent: -40, filter: 'blur(8px)', duration: 0.14, ease: 'power3.in' }, t + each - 0.14);
          tl.set(codes[i], { backgroundColor: 'rgba(0,0,0,0)', color: 'var(--ink-muted)', boxShadow: 'inset 0 0 0 2px var(--line)' }, t + each);
        }
      });
      S.tx.out(c, $('.stage'), 'blur');
      c.done();
    });
  })();
  </script>
